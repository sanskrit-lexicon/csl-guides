name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: read — the deploy only reads (see the catalog guard below: a bot
# commit cannot satisfy main's required check, GH006, so it must never try).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Docusaurus' showLastUpdateTime reads each page's real last-commit
          # date. A shallow clone (the default) would stamp every page with the same date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Also gated here, not just in ci.yml: that workflow runs only on
      # pull_request, so a direct push to main would publish an unchecked quiz to
      # the live site — which is exactly the surface the H1387 defect sat on.
      # Deliberately NOT continue-on-error; it is deterministic, so a red here
      # means the data really is gameable and should not ship.
      - name: Verify quiz answer positions
        run: npm run verify:quiz-positions
      - name: Refresh dictionary catalog from live site (non-fatal)
        run: npm run build:catalog
        continue-on-error: true
      # H7906: the refresh above happens in the runner's working tree, and nothing
      # commits it. That is exactly how the deployed card came to say 45
      # dictionaries while main said 44. Committing from here is not an option:
      # main requires the "Build Docusaurus (no deploy)" check, and a GITHUB_TOKEN
      # push cannot satisfy it (GH006), so the write-back was refused and the site
      # published an uncommitted number anyway.
      # Therefore this step REFUSES to publish one: if the refreshed feed differs
      # from the commit, it restores the committed file and builds that. The site
      # and the commit then agree by construction; freshness becomes a deliberate
      # `npm run build:catalog` + PR, not a side effect of deploying.
      - name: Refuse to publish an uncommitted catalogue
        run: |
          set -euo pipefail
          F=src/data/dictionaries.json
          if git diff -I '"generatedAt"' --quiet -- "$F"; then
            echo "catalog matches the commit"
            exit 0
          fi
          echo "::warning title=Catalog drift::live CDSL differs from the committed feed; the deploy will publish the committed file. Run 'npm run build:catalog' and merge a PR to ship the refresh."
          echo "DRIFT: $F differs from the commit — restoring the committed feed"
          git checkout -- "$F"
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
