name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: read — the workflow's own token must never push: it cannot satisfy
# main's required check (GH006). The optional catalog write-back below uses a
# separate, admin-owned PAT instead.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Docusaurus' showLastUpdateTime reads each page's real last-commit
          # date. A shallow clone (the default) would stamp every page with the same date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Also gated here, not just in ci.yml: that workflow runs only on
      # pull_request, so a direct push to main would publish an unchecked quiz to
      # the live site — which is exactly the surface the H1387 defect sat on.
      # Deliberately NOT continue-on-error; it is deterministic, so a red here
      # means the data really is gameable and should not ship.
      - name: Verify quiz answer positions
        run: npm run verify:quiz-positions
      - name: Refresh dictionary catalog from live site (non-fatal)
        run: npm run build:catalog
        continue-on-error: true
      # H7906: the refresh above happens in the runner's working tree, and nothing
      # commits it — which is how the deployed card came to say 45 dictionaries
      # while main said 44.
      #
      # Why the workflow's own GITHUB_TOKEN cannot commit it: main requires the
      # "Build Docusaurus (no deploy)" check, a token push carries no check-run, and
      # a repository ruleset cannot name the GitHub Actions app as a bypass actor on
      # this plan (integrations need org rulesets -> Team). An admin-owned PAT can:
      # main has enforce_admins=false, so an admin push is not held by the required
      # check. Such a push also re-triggers this workflow, whose next run finds the
      # catalog already committed and does nothing.
      #
      # With no PAT in secrets the deploy degrades to the safe behaviour: it
      # restores the committed feed and builds that, so the site never publishes an
      # uncommitted number.
      - name: Commit refreshed catalog when the data changed
        env:
          CATALOG_PUSH_TOKEN: ${{ secrets.CATALOG_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          F=src/data/dictionaries.json
          if git diff -I '"generatedAt"' --quiet -- "$F"; then
            echo "catalog matches the commit"
            exit 0
          fi
          if [ -z "${CATALOG_PUSH_TOKEN:-}" ]; then
            echo "::warning title=Catalog drift::live CDSL differs from the committed feed. This deploy publishes the committed file; run 'npm run build:catalog' and merge a PR, or set the CATALOG_PUSH_TOKEN secret to let the deploy commit it."
            git checkout -- "$F"
            echo "DRIFT: restored the committed feed (no CATALOG_PUSH_TOKEN)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "chore(catalog): refresh dictionaries.json from live CDSL [skip ci]"
          # actions/checkout persists its own token as an http extraheader, which
          # overrides the URL credential: the first attempt authenticated as
          # github-actions[bot] and got "Permission ... denied" (403). Drop the
          # header and strip stray whitespace from the secret before pushing.
          git config --local --unset-all http.https://github.com/.extraheader || true
          TOKEN="$(printf '%s' "${CATALOG_PUSH_TOKEN}" | tr -d '[:space:]')"
          if git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "catalog commit pushed to main (PAT)"
          else
            # Undo the local commit too: otherwise HEAD would carry 45 while main
            # stays at the previous feed, and the card (pinned to HEAD) would lie.
            git reset --hard HEAD~1
            echo "::warning title=Catalog push refused::the PAT push failed; the deploy builds the committed feed instead"
          fi
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
