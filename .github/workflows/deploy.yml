name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: write — the catalog write-back below commits the refreshed feed to
# main when the data actually changed (H7906). pages/id-token for the deploy.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Docusaurus' showLastUpdateTime reads each page's real last-commit
          # date. A shallow clone (the default) would stamp every page with the same date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Also gated here, not just in ci.yml: that workflow runs only on
      # pull_request, so a direct push to main would publish an unchecked quiz to
      # the live site — which is exactly the surface the H1387 defect sat on.
      # Deliberately NOT continue-on-error; it is deterministic, so a red here
      # means the data really is gameable and should not ship.
      - name: Verify quiz answer positions
        run: npm run verify:quiz-positions
      - name: Refresh dictionary catalog from live site (non-fatal)
        run: npm run build:catalog
        continue-on-error: true
      # H7906: this refresh used to live only in the runner's working tree, so the
      # deployed card said 45 dictionaries while main said 44 — the site and the
      # commit could disagree on every deploy. Commit the refreshed feed before the
      # build instead: the build then renders the commit it came from, and
      # plugins/og-cards pins the card's count row to HEAD, so the two cannot drift.
      # A push made with GITHUB_TOKEN does not re-trigger this workflow, so there is
      # no loop. The daily `generatedAt` date is ignored when deciding whether
      # anything real changed — otherwise every deploy would commit date-only churn.
      - name: Commit refreshed catalog when the data changed
        run: |
          set -euo pipefail
          F=src/data/dictionaries.json
          if git diff -I '"generatedAt"' --quiet -- "$F"; then
            echo "catalog data unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "chore(catalog): refresh dictionaries.json from live CDSL [skip ci]"
          if git push origin HEAD:main; then
            echo "catalog commit pushed to main"
          else
            # A concurrent human push won the race. The build below still uses the
            # refreshed file, and the card still states the committed feed (HEAD),
            # so this degrades to the old behaviour for one run, never to a lie.
            echo "WARN: catalog commit could not be pushed; the card will state the previous commit"
          fi
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
