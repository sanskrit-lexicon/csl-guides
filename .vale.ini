# Vale — EN-doc prose linting (ADR-0005, H8384). ADVISORY from day one:
# CI reports flag rates and stays green; blocking escalation is a later ruling.
#
# Scope: EN Markdown docs ONLY (docs/, blog/, community files). RU prose is
# explicitly OUT of scope — the RU voice is never mechanically linted. This
# site is English-first; the only Cyrillic found is bibliographic names
# (measured <=4% density, 17-11-2026), which stay linted via the Vocab list.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Estate

# Base: Microsoft style — this repo is a technical docs site (Docusaurus
# user + developer guides for the CDSL): procedures, UI terms, second person;
# the classic Microsoft Writing Style use case.
Packages = Microsoft

[formats]
mdx = md

[*.md]
BasedOnStyles = Vale, Microsoft

[*.mdx]
BasedOnStyles = Vale, Microsoft

# --- machine-generated / agent-internal, not prose ---
[CHANGELOG.md]
BasedOnStyles = NONE
[.ai_state.md]
BasedOnStyles = NONE
[AGENTS.md]
BasedOnStyles = NONE
[CLAUDE.md]
BasedOnStyles = NONE
[CONTEXT.md]
BasedOnStyles = NONE
[changelog_queue/**]
BasedOnStyles = NONE
[scripts/out/**]
BasedOnStyles = NONE
[build/**]
BasedOnStyles = NONE
[vendor/**]
BasedOnStyles = NONE
[.vale/**]
BasedOnStyles = NONE
